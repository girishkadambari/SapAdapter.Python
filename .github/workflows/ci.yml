name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: windows-latest  # Important: SAP-related code often expects Windows types

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest
        
    - name: Lint with Ruff
      run: ruff check .
      
    - name: Type check with Pydantic
      run: |
        # Basic validation of schemas
        python -c "from sap_mcp.schemas import ActionRequest; print('Schemas OK')"

    - name: Run tests
      run: |
        # Note: Functional SAP tests will fail without SAP GUI installed, 
        # but we can run unit tests or registry tests.
        pytest tests/test_registry.py
